<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Öncü Halı Saha</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800;900&family=Space+Mono:wght@400;700&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #0a1419;
            --bg-card: #1a2332;
            --neon-green: #00FF41;
            --neon-pink: #FF006E;
            --team1-accent: #00FF41;
            --team2-accent: #00D9FF;
            --text-primary: #ffffff;
            --text-secondary: #b0b8c1;
            --glow-intensity: 0.8;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0a1419 0%, #1a2a3a 100%);
            color: var(--text-primary);
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(2px 2px at 20px 30px, rgba(0, 255, 65, 0.1), rgba(255, 255, 255, 0)),
                radial-gradient(2px 2px at 60px 70px, rgba(0, 217, 255, 0.1), rgba(255, 255, 255, 0)),
                radial-gradient(1px 1px at 50px 50px, rgba(255, 0, 110, 0.05), rgba(255, 255, 255, 0)),
                radial-gradient(1px 1px at 130px 80px, rgba(0, 255, 65, 0.05), rgba(255, 255, 255, 0)),
                radial-gradient(2px 2px at 90px 10px, rgba(0, 217, 255, 0.1), rgba(255, 255, 255, 0));
            background-repeat: repeat;
            background-size: 200px 200px;
            animation: drift 20s linear infinite;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes drift {
            0% {
                transform: translate(0, 0);
            }

            100% {
                transform: translate(50px, 50px);
            }
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            padding: 40px 20px 30px;
            margin-bottom: 30px;
            animation: slideInDown 0.8s ease-out;
        }

        @keyframes slideInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header-title {
            font-size: clamp(2rem, 8vw, 4rem);
            font-weight: 900;
            letter-spacing: -1px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, var(--neon-green) 0%, var(--team2-accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(0, 255, 65, 0.3);
            animation: glow 2s ease-in-out infinite;
        }

        @keyframes glow {

            0%,
            100% {
                filter: drop-shadow(0 0 10px rgba(0, 255, 65, 0.3));
            }

            50% {
                filter: drop-shadow(0 0 20px rgba(0, 255, 65, 0.6));
            }
        }

        .header-subtitle {
            font-size: clamp(1rem, 4vw, 1.3rem);
            color: var(--text-secondary);
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 40px;
        }

        .countdown-container {
            background: rgba(26, 35, 50, 0.6);
            border: 2px solid rgba(0, 255, 65, 0.2);
            border-radius: 20px;
            padding: 40px 20px;
            margin-bottom: 50px;
            backdrop-filter: blur(10px);
            animation: slideInUp 0.8s ease-out 0.2s both;
            box-shadow:
                0 0 20px rgba(0, 255, 65, 0.15),
                inset 0 0 20px rgba(0, 255, 65, 0.05);
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .countdown-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            max-width: 600px;
            margin: 0 auto;
            margin-bottom: 20px;
        }

        @media (max-width: 480px) {
            .countdown-grid {
                gap: 8px;
            }
        }

        .countdown-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .countdown-number {
            font-family: 'Space Mono', monospace;
            font-size: clamp(2rem, 6vw, 3.5rem);
            font-weight: 700;
            color: var(--neon-green);
            text-shadow:
                0 0 10px rgba(0, 255, 65, 0.5),
                0 0 20px rgba(0, 255, 65, 0.3);
            letter-spacing: -2px;
            line-height: 1;
        }

        .countdown-label {
            font-size: clamp(0.75rem, 2.5vw, 0.95rem);
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .countdown-status {
            font-size: clamp(1.2rem, 4vw, 1.8rem);
            font-weight: 700;
            text-align: center;
            color: var(--neon-green);
            text-shadow: 0 0 15px rgba(0, 255, 65, 0.5);
            display: none;
        }

        .countdown-status.active {
            display: block;
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.05);
                opacity: 0.8;
            }
        }

        .teams-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 50px;
            align-items: start;
            animation: slideInUp 0.8s ease-out 0.4s both;
        }

        @media (max-width: 768px) {
            .teams-container {
                grid-template-columns: 1fr;
                gap: 25px;
            }
        }

        .team-card {
            background: rgba(26, 35, 50, 0.4);
            border: 2px solid;
            border-radius: 15px;
            padding: 30px 25px;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        .team-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 40px rgba(0, 255, 65, 0.2);
        }

        .team-card.team1 {
            border-color: rgba(0, 255, 65, 0.4);
            color: var(--text-primary);
        }

        .team-card.team1:hover {
            border-color: rgba(0, 255, 65, 0.8);
            box-shadow:
                0 10px 40px rgba(0, 255, 65, 0.2),
                inset 0 0 20px rgba(0, 255, 65, 0.05);
        }

        .team-card.team2 {
            border-color: rgba(0, 217, 255, 0.4);
        }

        .team-card.team2:hover {
            border-color: rgba(0, 217, 255, 0.8);
            box-shadow:
                0 10px 40px rgba(0, 217, 255, 0.2),
                inset 0 0 20px rgba(0, 217, 255, 0.05);
        }

        .team-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, rgba(0, 255, 65, 0.6), transparent);
        }

        .team-card.team2::before {
            background: linear-gradient(90deg, rgba(0, 217, 255, 0.6), transparent);
        }

        .team-name {
            font-size: clamp(1.5rem, 4vw, 2rem);
            font-weight: 800;
            margin-bottom: 5px;
            letter-spacing: -0.5px;
        }

        .team-card.team1 .team-name {
            color: var(--neon-green);
            text-shadow: 0 0 10px rgba(0, 255, 65, 0.3);
        }

        .team-card.team2 .team-name {
            color: var(--team2-accent);
            text-shadow: 0 0 10px rgba(0, 217, 255, 0.3);
        }

        .team-captain-section {
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .captain-label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .captain-name {
            font-size: clamp(1.1rem, 3vw, 1.4rem);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .captain-icon {
            font-size: 1.3em;
            animation: spin 3s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .players-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .players-label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .player-item {
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            border-left: 3px solid;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-primary);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .team-card.team1 .player-item {
            border-left-color: rgba(0, 255, 65, 0.4);
        }

        .team-card.team1 .player-item:hover {
            background: rgba(0, 255, 65, 0.1);
            border-left-color: rgba(0, 255, 65, 0.8);
            transform: translateX(5px);
        }

        .team-card.team2 .player-item {
            border-left-color: rgba(0, 217, 255, 0.4);
        }

        .team-card.team2 .player-item:hover {
            background: rgba(0, 217, 255, 0.1);
            border-left-color: rgba(0, 217, 255, 0.8);
            transform: translateX(5px);
        }

        .player-icon {
            font-size: 1.1em;
        }

        .vs-container {
            display: none;
            grid-column: 1 / -1;
            justify-content: center;
            align-items: center;
            margin: -15px 0;
            position: relative;
            z-index: 3;
        }

        @media (min-width: 769px) {
            .vs-container {
                display: flex;
                position: absolute;
                left: 50%;
                top: 50%;
                transform: translate(-50%, -50%);
                width: auto;
                margin: 0;
                z-index: 10;
            }
        }

        .vs-text {
            font-size: clamp(1.5rem, 5vw, 2.5rem);
            font-weight: 900;
            background: linear-gradient(135deg, var(--neon-green), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 20px rgba(255, 0, 110, 0.3);
            letter-spacing: -1px;
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }
        }

        .footer {
            text-align: center;
            padding: 40px 20px;
            border-top: 1px solid rgba(0, 255, 65, 0.1);
            animation: slideInUp 0.8s ease-out 0.6s both;
        }

        .footer-text {
            font-size: clamp(1rem, 3vw, 1.3rem);
            font-weight: 600;
            background: linear-gradient(135deg, var(--neon-green) 0%, var(--neon-pink) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 15px rgba(0, 255, 65, 0.2);
            letter-spacing: 0.5px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 15px;
            }

            .header {
                padding: 30px 15px 20px;
                margin-bottom: 20px;
            }

            .countdown-container {
                padding: 25px 15px;
                margin-bottom: 35px;
            }

            .team-card {
                padding: 25px 20px;
            }

            .teams-container {
                gap: 20px;
                margin-bottom: 35px;
            }

            .footer {
                padding: 30px 15px;
            }
        }

        @keyframes celebration {
            0% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }

            100% {
                transform: scale(1.2) rotate(5deg);
                opacity: 0.8;
            }
        }

        .celebrating {
            animation: celebration 0.6s ease-in-out infinite;
        }
    </style>
</head>

<body>
    <div class="container">

        <div class="header">
            <h1 class="header-title">PAZARTESİ HESAPLAŞMASI</h1>
            <p class="header-subtitle" id="randomMessage"></p>
        </div>

        <div class="countdown-container">
            <div class="countdown-grid">
                <div class="countdown-item">
                    <div class="countdown-number" id="days">00</div>
                    <div class="countdown-label">GÜN</div>
                </div>
                <div class="countdown-item">
                    <div class="countdown-number" id="hours">00</div>
                    <div class="countdown-label">SAAT</div>
                </div>
                <div class="countdown-item">
                    <div class="countdown-number" id="minutes">00</div>
                    <div class="countdown-label">DAKİKA</div>
                </div>
                <div class="countdown-item">
                    <div class="countdown-number" id="seconds">00</div>
                    <div class="countdown-label">SANİYE</div>
                </div>
            </div>
            <div class="countdown-status" id="countdownStatus">🔥 MAÇ BAŞLADI! ⚽ 🔥</div>
        </div>

        <div style="position: relative;">
            <div class="teams-container">

                <div class="team-card team1">
                    <div class="team-name" id="team1Name">TAKIM</div>

                    <div class="team-captain-section">
                        <div class="captain-name">
                            <span class="captain-icon">👑</span>
                            <span id="team1Captain">Kaptan 1</span>
                        </div>
                    </div>

                    <div class="players-section">
                        <div class="players-label">Oyuncular</div>
                        <div id="team1Players"></div>
                    </div>
                </div>

                <div class="team-card team2">
                    <div class="team-name" id="team2Name">TAKIM 2</div>

                    <div class="team-captain-section">
                        <div class="captain-name">
                            <span class="captain-icon">👑</span>
                            <span id="team2Captain">Kaptan 2</span>
                        </div>
                    </div>

                    <div class="players-section">
                        <div class="players-label">Oyuncular</div>
                        <div id="team2Players"></div>
                    </div>
                </div>
            </div>

            <div class="vs-container">
                <div class="vs-text">VS</div>
            </div>
        </div>

        <div class="footer">
            <p class="footer-text">İyi Maçlar! ⚽ 🔥</p>
        </div>
    </div>

    <script>

        const MATCH_DATE = new Date(2026, 7, 17, 22, 15, 0).getTime();

        const TEAM1 = {
            name: "TAKIM 1",
            captain: "ERAY",
            players: [
                "Samet",
                "Mert",
                "Berke",
                "Abdullah",
                "İbrahim",
                "Ege"
            ]
        };

        const TEAM2 = {
            name: "TAKIM 2",
            captain: "HABIB",
            players: [
                "Erol",
                "Egehan",
                "Sergio",
                "Ömer",
                "Rafet",
                "Sercan"
            ]
        };

        function initializePage() {
            loadTeamData(TEAM1, 'team1');
            loadTeamData(TEAM2, 'team2');
            updateCountdown();
            setInterval(updateCountdown, 1000);
        }

        function loadTeamData(teamData, teamPrefix) {
            document.getElementById(`${teamPrefix}Name`).textContent = teamData.name;

            document.getElementById(`${teamPrefix}Captain`).textContent = teamData.captain;

            const playersContainer = document.getElementById(`${teamPrefix}Players`);
            playersContainer.innerHTML = '';

            teamData.players.forEach(player => {
                const playerElement = document.createElement('div');
                playerElement.className = 'player-item';
                playerElement.innerHTML = `<span class="player-icon">⚽</span> ${player}`;
                playersContainer.appendChild(playerElement);
            });
        }

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = MATCH_DATE - now;

            if (distance < 0) {
                document.getElementById('days').textContent = '00';
                document.getElementById('hours').textContent = '00';
                document.getElementById('minutes').textContent = '00';
                document.getElementById('seconds').textContent = '00';
                document.getElementById('countdownStatus').classList.add('active');

                document.querySelectorAll('.team-card').forEach(card => {
                    card.classList.add('celebrating');
                });

                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById('days').textContent = String(days).padStart(2, '0');
            document.getElementById('hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
            document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
        }

        document.addEventListener('DOMContentLoaded', initializePage);

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializePage);
        } else {
            initializePage();
        }


        const messages = [
            "Bahaneler maçtan sonra alınacaktır.",
            "Bugün dostluk yok, sadece 3 puan var!",
            "90 dakika boyunca herkes kendi başının çaresine baksın.",
            "Terlemeye, bağırmaya ve birbirimize kızmaya hazır mıyız? ",
            "Maç başlıyor, dostluk maç sonunda geri gelecek.",
            "Kimse sakatlanmasın, gerisi önemli değil.",
            "Bugün herkes Messi, yarın yine işe devam.",
            "Kaleciler hazır mı? Bahaneler de hazır olsun.",
            "Forma tamam, kondisyon yok. Her zamanki gibi. ",
            "İlk 10 dakika herkes profesyonel, sonrası Allah kerim.",
            "Kaybeden takım çayı koyar.",
            "Maçın favorisi belli değil, ama kavga kesin.",
            "VAR yok, itiraz çok.",
            "Bugün sahada konuşacağız.",
            "Sakatlık yok, sadece gurur incinmesi var."
        ];

        const randomMessage =
            messages[Math.floor(Math.random() * messages.length)];

        document.getElementById("randomMessage").textContent = randomMessage;
    </script>
</body>

</html>
